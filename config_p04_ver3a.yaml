context:
  dryrun: False # If true, will not interact with GCP resources
  project: university-of-ottawa # The name of the output project
  keyfile: .keyfile.json # The location of the service account keyfile that will be used to authenticate. Can be left as-is
  output_dir: .out # The directory to write outputs to. Can be left as-is
  run_version: 20260924 # The date identitifer. Output tables will be sharded with this date
  doi_version: 20261008 # The doi table version to use
partners:
  - institution_id: p04_ohi # Name of the partner. Will determine the name of the output dataset. Static dataset (_from_partners data) must be formattetd with this prefix
    dois_table_name: dois_20260831 # The static dois partner table name
    oddpub_table_name: oddpub_20260831 # The static oddpub partner table name
    trials_aact_table_name: trials_aact_20260831 # The static trials_aact table name
    year_cutoff_start: 2000 # Pubs with published_year < this are excluded from output. Optional - defaults to 1
    year_cutoff_end: 2026 # Pubs with published_year > this are excluded from output    
